services:
  localstack:
    image: localstack/localstack:3.8  # pinned; newer tags may need an auth token
    ports: ["4566:4566"]
    environment:
      SERVICES: sqs,dynamodb,apigateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 20
  backend:
    build: ../backend
    depends_on:
      localstack: { condition: service_healthy }
    ports: ["8080:8080"]
    env_file:
      - { path: ../.env, required: false }  # optional overrides; defaults live in code
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}  # LocalStack accepts any value; real AWS uses the task/pod role
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SCENARIO: ${SCENARIO:-MID}
      BUDGET: ${BUDGET:-MID}
      SIM_LATENCY_MS: ${SIM_LATENCY_MS:-300}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-5}
    # queues/tables must exist first: terraform apply (envs/local) after localstack is healthy
    restart: on-failure
  frontend:
    image: nginx:alpine
    ports: ["5173:80"]
    volumes: ["../frontend/index.html:/usr/share/nginx/html/index.html:ro"]
