<line class="lifeline" data-actor="U" x1="1086.161" y1="70" x2="1086.161" y2="570" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="P" data-to="G" data-label="POST /admin/publishes" data-line-style="solid" data-arrow-head="filled" data-self="false">
