<!doctype html>
<meta charset="utf-8">
<title>Template update harness</title>
<!-- TEST HARNESS ONLY: shows the pending badge + summary the real UI would render. -->
<style>
  body { font: 15px system-ui; max-width: 560px; margin: 2rem auto; padding: 0 1rem }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; background: #d33; color: #fff }
  .badge[hidden] { display: none }
  button { margin-right: .5rem }
</style>
<h1>Engagement <code id="eng">e1</code> <span id="badge" class="badge" hidden>Update available</span></h1>
<p id="summary" data-testid="summary"></p>
<p>
  <button id="publish">Publish new version</button>
  <button id="decline">Decline</button>
  <button id="withdraw">Withdraw</button>
</p>
<pre id="log"></pre>
<script>
const API = new URLSearchParams(location.search).get("api") || "http://localhost:8080";
const eng = "e1";
let offer = null;
const log = t => document.getElementById("log").textContent = t;
const err = document.createElement("p");
err.id = "error"; err.setAttribute("data-testid", "error"); err.style.color = "#d33";
document.getElementById("log").before(err);
const call = async (m, p, b) => {
  try {
    const r = await fetch(API + p, { method: m, headers: { "Content-Type": "application/json" }, body: b && JSON.stringify(b) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    err.textContent = "";
    return j;
  } catch (e) {
    err.textContent = `API error on ${m} ${p}: ${e.message}`;
    return {};
  }
};

async function poll() {
  const s = await call("GET", `/engagements/${eng}/status`);
  document.getElementById("badge").hidden = !s.pending;
  document.getElementById("summary").textContent = s.summary || "";
}
document.getElementById("publish").onclick = async () => {
  const version = "v" + Date.now();
  const r = await call("POST", "/admin/publishes",
    { templateId: "tpl-audit", version, engagements: [{ id: eng, firmId: "f1" }] });
  offer = r.offerId;
  log(JSON.stringify(r));
};
document.getElementById("decline").onclick = async () => { log(JSON.stringify(await call("POST", `/engagements/${eng}/decision`, { action: "decline" }))); poll(); };
document.getElementById("withdraw").onclick = async () => { if (offer) log(JSON.stringify(await call("POST", `/admin/offers/${offer}/withdraw`))); poll(); };
setInterval(poll, 1000); poll();
</script>
